<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario de la Rosa</title>
<meta name="theme-color" content="#14181c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<style>
:root{
  --fondo:#14181c;
  --panel:#1c2228;
  --panel-2:#2c3440;
  --linea:#2c3440;
  --texto:#9ab;
  --claro:#e8eef4;
  --tenue:#678;
  --rosa:#E8467C;
  --oro:#F2C14E;
  --naranja:#F2994A;
  --radio:6px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;min-height:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rosa);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;color:#fff;font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:600;line-height:1.15}
.caja{max-width:1000px;margin:0 auto;padding:0 18px}
.oculto{display:none!important}

/* ============ ENCABEZADO ============ */
.barra{background:var(--fondo);position:relative;z-index:20}
.barra .caja{display:flex;align-items:center;gap:18px;height:64px}
.logo{display:flex;align-items:center;gap:9px;color:#fff;font-family:"Fraunces",serif;font-weight:800;font-size:21px;letter-spacing:-.01em;white-space:nowrap}
.logo svg{width:24px;height:24px}
.menu{display:flex;align-items:center;gap:18px;margin-left:auto}
.menu a,.menu .yo-btn{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#bcd}
.menu a:hover,.menu .yo-btn:hover{color:#fff}
.yo-btn{display:flex;align-items:center;gap:8px}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;flex:0 0 auto;letter-spacing:0;text-transform:uppercase}
.boton{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--rosa);color:#fff;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:4px;white-space:nowrap}
.boton:hover{filter:brightness(1.1)}
.boton.gris{background:var(--panel-2);color:#cde}
.boton.fino{text-transform:none;letter-spacing:0;font-size:14px}
.desplegable{position:absolute;top:56px;background:#8899aa;border-radius:4px;min-width:170px;padding:6px 0;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:30}
.desplegable a,.desplegable button{display:block;width:100%;text-align:left;padding:6px 16px;color:#123;font-size:14px}
.desplegable a:hover,.desplegable button:hover{background:#667788;color:#fff}
.desplegable hr{border:0;border-top:1px solid #778899;margin:6px 0}
.hamburguesa{display:none}
@media(max-width:760px){
  .menu .solo-ancho{display:none}
  .logo span{font-size:18px}
  .barra .caja{gap:10px}
  .menu{gap:12px}
}
@media(max-width:430px){.logo span{display:none}}

/* ============ GENERALES ============ */
main{padding-bottom:80px;min-height:70vh}
.seccion-t{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--linea);padding-bottom:6px;margin:34px 0 14px}
.seccion-t h2{font-family:"DM Sans",sans-serif;font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--texto)}
.seccion-t a{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.seccion-t a:hover{color:#fff}
.vacio{color:var(--tenue);padding:26px 0;text-align:center}
.cargando{color:var(--tenue);padding:40px 0;text-align:center}
.estrellas-txt{color:var(--oro);letter-spacing:1px;white-space:nowrap}
.corazon{color:var(--naranja)}

/* ============ PORTADAS ============ */
.lamina{position:relative;aspect-ratio:2/3;border-radius:4px;overflow:hidden;display:grid;place-items:center;padding:10px;box-shadow:inset 0 0 0 1px rgba(221,238,255,.25)}
.lamina img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lamina .rotulo{position:relative;font-family:"Fraunces",serif;font-size:15px;line-height:1.2;text-align:center;text-wrap:balance;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.lamina .marca-ep{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;padding:2px 6px;border-radius:3px}
a.lamina:hover{box-shadow:inset 0 0 0 2px var(--rosa)}

.fila-posters{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media(max-width:760px){.fila-posters{grid-template-columns:repeat(3,1fr)}}
.poster-act .pie{display:flex;align-items:center;gap:6px;background:var(--panel-2);border-radius:0 0 4px 4px;padding:5px 7px;font-size:12px;color:#cde;margin-top:-4px}
.poster-act .pie .avatar{width:18px;height:18px;font-size:9px}
.poster-act .pie span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poster-act .sub{display:flex;justify-content:space-between;font-size:11.5px;margin-top:4px;color:var(--tenue)}

.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.rejilla .item h3{font-family:"DM Sans",sans-serif;font-size:13px;font-weight:500;color:#cde;margin-top:6px;line-height:1.3}
.rejilla .item .mia{font-size:12px;margin-top:2px;min-height:18px;color:var(--tenue)}

/* ============ PORTADA DE INICIO ============ */
.bienvenida{text-align:center;padding:30px 0 4px}
.bienvenida p{font-size:24px;font-weight:300;color:#bcd;margin:0;font-family:"DM Sans",sans-serif}
.bienvenida p b{color:#fff;font-weight:500}
.heroe{text-align:center;padding:64px 0 30px}
.heroe h1{font-size:clamp(30px,5vw,46px);font-weight:800;line-height:1.12;letter-spacing:-.01em}
.heroe p{margin:16px 0 26px;font-size:16px}
.heroe .boton{font-size:15px;padding:12px 22px}
.aviso-local{background:var(--panel-2);border-radius:var(--radio);padding:14px 16px;margin-top:20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:#cde}

/* ============ RESEÑAS ============ */
.resena{display:flex;gap:14px;padding:18px 0;border-bottom:1px solid var(--linea)}
.resena .lamina{width:70px;flex:0 0 auto}
.resena .cuerpo{flex:1;min-width:0}
.resena .quien{font-size:13px;color:var(--tenue);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.resena .quien b{color:#cde;font-weight:700}
.resena h3{font-size:19px;margin:4px 0 2px}
.resena .texto{font-family:"Fraunces",serif;font-size:16px;line-height:1.6;color:#cde;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}

/* ============ CAPÍTULOS ============ */
.herramientas{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:24px 0 10px}
.herramientas input[type=search]{flex:1 1 240px;padding:10px 12px;background:var(--panel-2);border:0;border-radius:4px;color:#fff}
.herramientas select,.chip{background:var(--panel-2);border:0;border-radius:4px;padding:9px 12px;font-size:13px;color:#cde}
.chip[aria-pressed="true"]{background:var(--rosa);color:#fff}
.conteo{font-size:12.5px;color:var(--tenue);margin-bottom:14px}
.mas{display:flex;justify-content:center;margin-top:24px}

/* ============ FICHA DE CAPÍTULO ============ */
.fondo-cap{position:relative;height:clamp(200px,42vw,420px);overflow:hidden}
.fondo-cap .img{position:absolute;inset:0;background-size:cover;background-position:center 30%}
.fondo-cap::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(20,24,28,.35) 0%,rgba(20,24,28,.1) 40%,var(--fondo) 100%),linear-gradient(to right,var(--fondo) 0%,transparent 18%,transparent 82%,var(--fondo) 100%)}
.cap{display:grid;grid-template-columns:200px 1fr 260px;gap:30px;margin-top:-120px;position:relative;z-index:2}
.cap .col-poster .lamina{box-shadow:0 8px 30px rgba(0,0,0,.5),inset 0 0 0 1px rgba(221,238,255,.25)}
.cifras{display:flex;justify-content:center;gap:14px;font-size:13px;margin-top:10px}
.cap h1{font-size:clamp(28px,4vw,40px);font-weight:800;margin-top:60px}
.cap .meta{margin-top:8px;color:#bcd}
.cap .meta a{text-decoration:underline;text-decoration-color:var(--tenue)}
.cap .sinopsis{font-family:"Fraunces",serif;font-size:17px;line-height:1.65;color:#cde;margin-top:18px}
.cap .sinopsis.vacia{font-family:"DM Sans",sans-serif;font-size:14px;font-style:italic;color:var(--tenue)}
.panel{background:#456;border-radius:var(--radio);overflow:hidden;color:#cde;margin-top:60px}
.panel .acciones{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 6px 10px}
.panel .accion{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:#cde}
.panel .accion svg{width:34px;height:34px}
.panel .fila{border-top:1px solid #567;padding:11px 12px;text-align:center;font-size:14px}
.panel button.fila{display:block;width:100%}
.panel button.fila:hover{color:#fff;background:#4c5c6c}
.panel .calif{padding:12px;text-align:center;border-top:1px solid #567}
.panel .calif small{display:block;font-size:12.5px;margin-bottom:4px}
.histo{margin-top:34px}
.histo .barras{display:flex;align-items:flex-end;gap:2px;height:52px;flex:1}
.histo .barras span{flex:1;background:#456;border-radius:2px 2px 0 0;min-height:2px}
.histo .fila-h{display:flex;align-items:flex-end;gap:10px}
.histo .prom{font-family:"Fraunces",serif;font-size:26px;color:#cde;line-height:1}
@media(max-width:860px){
  .cap{grid-template-columns:110px 1fr;gap:18px;margin-top:-80px}
  .cap h1{margin-top:34px}
  .cap .col-panel{grid-column:1/-1}
  .panel{margin-top:10px}
}

/* ============ PERFIL ============ */
.perfil-cab{display:flex;align-items:center;gap:22px;margin-top:36px;flex-wrap:wrap}
.perfil-cab .avatar{width:96px;height:96px;font-size:36px}
.perfil-cab h1{font-size:30px}
.perfil-cab .bio{color:#bcd;margin-top:6px;max-width:48ch}
.perfil-cab .datos{margin-left:auto;display:flex;gap:4px}
.perfil-cab .dato{text-align:center;padding:0 12px;border-left:1px solid var(--linea)}
.perfil-cab .dato:first-child{border-left:0}
.perfil-cab .dato b{display:block;font-family:"Fraunces",serif;font-size:28px;color:#fff;font-weight:600;line-height:1.1}
.perfil-cab .dato span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.pestanas{display:flex;justify-content:center;gap:4px;border:1px solid var(--linea);border-radius:var(--radio);margin-top:26px;overflow-x:auto}
.pestanas a{padding:12px 14px;font-size:15px;color:#bcd;border-bottom:2px solid transparent;white-space:nowrap}
.pestanas a.activa{color:#fff;border-bottom-color:var(--rosa)}
.fila-favs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fila-favs .hueco{aspect-ratio:2/3;border-radius:4px;border:1px dashed var(--linea)}
.diario{width:100%;border-collapse:collapse;font-size:14px}
.diario th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--linea)}
.diario td{padding:10px 6px;border-bottom:1px solid var(--linea);vertical-align:middle}
.diario .mes{font-family:"Fraunces",serif;font-size:15px;color:#cde;white-space:nowrap}
.diario .dia{font-size:22px;color:#fff;font-family:"Fraunces",serif}
.diario a:hover{color:#fff}
.miembro{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--linea)}
.miembro .avatar{width:44px;height:44px;font-size:17px}
.miembro b{color:#fff;font-size:16px}
.miembro .n{margin-left:auto;font-size:13px;color:var(--tenue);text-align:right}
@media(max-width:760px){
  .perfil-cab .datos{margin-left:0;width:100%;justify-content:space-around}
  .diario .ocultable{display:none}
}

/* ============ VENTANAS ============ */
.telon{position:fixed;inset:0;background:rgba(10,12,14,.78);z-index:60;display:grid;place-items:center;padding:16px}
.ventana{background:#456;color:#def;border-radius:8px;width:min(560px,100%);max-height:90vh;overflow-y:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.ventana h2{font-size:24px;margin-bottom:14px}
.ventana label{display:block;font-size:13px;margin:12px 0 5px;color:#cde}
.ventana input,.ventana textarea{width:100%;padding:11px 12px;background:#cde;color:#123;border:0;border-radius:4px;font-size:15px}
.ventana textarea{min-height:130px;resize:vertical;font-family:"Fraunces",serif;line-height:1.5}
.ventana .pie-v{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;align-items:center}
.ventana .error{color:#ffc2d4;font-size:13.5px;min-height:20px;margin-top:10px}
.ventana .cambio{font-size:13.5px;margin-top:14px;text-align:center}
.ventana .cambio button{text-decoration:underline;color:#fff}
.ventana .ayuda{font-size:12.5px;color:#bcd;margin-top:4px}
.ventana .opciones{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:14px}
.estrellas{display:inline-flex;gap:1px;vertical-align:middle}
.estrellas button{width:32px;height:32px}
.estrellas svg{width:30px;height:30px;display:block}
.estrellas.chicas button{width:26px;height:26px}
.estrellas.chicas svg{width:24px;height:24px}
.toggle-like{display:flex;align-items:center;gap:6px;font-size:14px}
.toggle-like svg{width:26px;height:26px}

#aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:#fff;color:#14181c;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
#aviso.visible{opacity:1}
#petalo{position:fixed;inset:0;z-index:95;pointer-events:none;display:none;place-items:center}
#petalo.vuela{display:grid}
#petalo svg{width:110px;height:110px;animation:viento 1.1s ease-out forwards}
@keyframes viento{0%{opacity:0;transform:translate(-40px,26px) rotate(-22deg) scale(.7)}35%{opacity:1}100%{opacity:0;transform:translate(60px,-120px) rotate(18deg) scale(1.15)}}
@media (prefers-reduced-motion:reduce){#petalo svg{animation:none}}
.config{max-width:560px;margin:60px auto;background:var(--panel-2);padding:22px;border-radius:8px;color:#cde}
.config code{background:#14181c;padding:2px 6px;border-radius:3px}
</style>
</head>
<body>

<header class="barra">
  <div class="caja">
    <a class="logo" href="#/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c0-5 2-8 6-9-4-1-6-4-6-9 0 5-2 8-6 9 4 1 6 4 6 9Z" fill="#fff"/><circle cx="12" cy="12" r="2.6" fill="#E8467C"/></svg>
      <span>Diario de la Rosa</span>
    </a>
    <nav class="menu" id="menu"></nav>
  </div>
</header>

<main id="vista"></main>

<div id="aviso" role="status"></div>
<div id="petalo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21c0-5 2-8 6-9-4-1-6-4-6-9 0 5-2 8-6 9 4 1 6 4 6 9Z" fill="#fff"/><circle cx="12" cy="12" r="2.6" fill="#E8467C"/></svg></div>

<script>
/* =========================================================
   Diario de la Rosa — estilo Letterboxd para La Rosa de Guadalupe
   Catálogo: capitulos.json (construir-catalogo.mjs)
   Cuentas y reseñas: Supabase (ver supabase.sql)
   ========================================================= */

/* ---------- CONFIGURACIÓN: pega aquí los datos de tu proyecto ---------- */
const SUPABASE_URL = "https://rtkcqntpakdprzoqnexf.supabase.co";     // https://xxxx.supabase.co
const SUPABASE_KEY = "sb_publishable_VdNTR1_auHE8YUHsCyopiw_6maKtONr";  // sb_publishable_... o la anon key
const DOMINIO_CUENTAS = "usuarios.diario-rosa.app";   // correo interno, nadie lo ve

const IMG = "https://image.tmdb.org/t/p/";
const SEMILLA = [
  {s:1,e:1,t:"Mi hija vive",n:"Primer capítulo de la serie."},
  {s:15,e:1,t:"Flor de otoño",d:"2022-01-31"}
];

/* ---------- estado ---------- */
const configurado = !SUPABASE_URL.startsWith("PEGA") && window.supabase;
const sb = configurado ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

let catalogo = SEMILLA.slice();
let porId = new Map();
let yo = null;                 // {id, usuario, bio, favoritos}
let mios = new Map();          // cap -> registro

const id = c => c.s + "x" + c.e;

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const hoyISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function fecha(d){ if(!d) return ""; const [a,m,dd]=d.slice(0,10).split("-"); return `${+dd} ${MESES[+m-1]} ${a}`; }
function hace(ts){
  const s = (Date.now() - new Date(ts)) / 1000;
  if(s < 60) return "ahora";
  if(s < 3600) return `hace ${Math.floor(s/60)} min`;
  if(s < 86400) return `hace ${Math.floor(s/3600)} h`;
  if(s < 86400*30) return `hace ${Math.floor(s/86400)} d`;
  return fecha(new Date(ts).toISOString());
}
function estrellasTxt(v){ if(!v) return ""; v=+v; return "★".repeat(Math.floor(v)) + (v%1 ? "½" : ""); }
function tono(t){ let h=0; for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))>>>0; return h; }
function degradado(c){ const h=tono(c.t); return `linear-gradient(150deg,hsl(${320+h%40} 50% 30%),hsl(${(350+(h>>5)%50)%360} 45% 15%))`; }
function colorAvatar(u){ return `hsl(${tono(u)%360} 45% 42%)`; }
function avatar(u, extra=""){ return `<span class="avatar" style="background:${colorAvatar(u)}" ${extra}>${esc(u.slice(0,1))}</span>`; }

function avisar(msg){
  const a=$("#aviso"); a.textContent=msg; a.classList.add("visible");
  clearTimeout(avisar.t); avisar.t=setTimeout(()=>a.classList.remove("visible"),2200);
}
function petalo(){ const p=$("#petalo"); p.classList.remove("vuela"); void p.offsetWidth; p.classList.add("vuela"); setTimeout(()=>p.classList.remove("vuela"),1200); }

function lamina(c, {enlace=true, marca=false, talla="w342"}={}){
  const tag = enlace ? "a" : "div";
  const href = enlace ? ` href="#/cap/${id(c)}"` : "";
  const img = c.img ? `<img src="${IMG}${talla}${esc(c.img)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : "";
  const m = marca ? `<span class="marca-ep">T${c.s} · E${c.e}</span>` : "";
  return `<${tag} class="lamina"${href} style="background:${degradado(c)}" title="${esc(c.t)}">${img}<span class="rotulo">${esc(c.t)}</span>${m}</${tag}>`;
}

/* ---------- íconos ---------- */
const ICONO = {
  ojo: on => `<svg viewBox="0 0 24 24" fill="none"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="${on?"#E8467C":"none"}" stroke="${on?"#E8467C":"#9ab"}" stroke-width="1.6"/><circle cx="12" cy="12" r="3.3" fill="${on?"#14181c":"none"}" stroke="${on?"#14181c":"#9ab"}" stroke-width="1.6"/></svg>`,

/* ---------- estrellas interactivas ---------- */
function widgetEstrellas(cont, valor, alCambiar, chicas=false){
  cont.className = "estrellas" + (chicas ? " chicas" : "");
  const pintar = v => {
    cont.innerHTML = "";
    for(let i=1;i<=5;i++){
      const b=document.createElement("button");
      b.type="button";
      b.setAttribute("aria-label", `${i} ${i===1?"estrella":"estrellas"}`);
      const lleno=v>=i, medio=!lleno&&v>=i-.5, gid=`g${Math.random().toString(36).slice(2,8)}`;
      b.innerHTML=`<svg viewBox="0 0 24 24"><defs><linearGradient id="${gid}"><stop offset="50%" stop-color="#F2C14E"/><stop offset="50%" stop-color="#678"/></linearGradient></defs><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4-5.8-3-5.8 3 1.1-6.4L2.6 9.4l6.5-.9z" fill="${lleno?"#F2C14E":medio?`url(#${gid})`:"#678"}"/></svg>`;
      b.addEventListener("click", ev=>{
        const r=b.getBoundingClientRect();
        let nuevo = (ev.clientX - r.left) < r.width/2 ? i-.5 : i;
        if(nuevo===v) nuevo=0;
        v=nuevo; pintar(v); alCambiar(v);
      });
      cont.appendChild(b);
    }
  };
  pintar(valor||0);
}

async function cargarCatalogo(){
  try{
    const r = await fetch("capitulos.json");
    if(r.ok){ const d = await r.json(); if(Array.isArray(d) && d.length) catalogo = d; }
  }catch(e){}
  porId = new Map(catalogo.map(c => [id(c), c]));
}

async function cargarYo(){
  yo = null; mios = new Map();
  if(!sb) return;
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return;
  const { data:p } = await sb.from("perfiles").select("*").eq("id", session.user.id).maybeSingle();
  if(!p) return;
  yo = p;
  const { data:rs } = await sb.from("registros").select("*").eq("usuario_id", yo.id);
  (rs||[]).forEach(r => mios.set(r.cap, r));
}

async function guardarRegistro(cap, cambios){
  if(!yo){ abrirAcceso(); return null; }
  const actual = mios.get(cap) || { cal:null, visto:false, me_gusta:false, por_ver:false, resena:null, visto_el:null };
  const fila = {
    usuario_id: yo.id, cap,
    cal: actual.cal, visto: actual.visto, me_gusta: actual.me_gusta,
    por_ver: actual.por_ver, resena: actual.resena, visto_el: actual.visto_el,
    ...cambios
  };
  if(fila.visto || fila.cal || fila.resena) fila.por_ver = cambios.por_ver ?? false;
  if(fila.cal === 0) fila.cal = null;
  if(fila.resena === "") fila.resena = null;
  const vacio = !fila.cal && !fila.visto && !fila.me_gusta && !fila.por_ver && !fila.resena;
  if(vacio){
    const { error } = await sb.from("registros").delete().eq("usuario_id", yo.id).eq("cap", cap);
    if(error){ avisar("No se pudo guardar. Revisa tu conexión."); return null; }
    mios.delete(cap); return null;
  }
  const { data, error } = await sb.from("registros").upsert(fila, { onConflict:"usuario_id,cap" }).select().single();
  if(error){ avisar("No se pudo guardar. Revisa tu conexión."); console.error(error); return null; }
  mios.set(cap, data);
  return data;
}

/* =========================================================
   ACCESO: usuario + contraseña
   ========================================================= */
function abrirAcceso(modo="entrar"){
  if(!sb){ avisar("Falta configurar Supabase"); return; }
  const t = document.createElement("div");
  t.className = "telon";
  const pintar = () => {
    const crear = modo === "crear";
    t.innerHTML = `
      <form class="ventana" autocomplete="on">
        <h2>${crear ? "Crear cuenta" : "Entrar"}</h2>
        <label for="a-u">Nombre de usuario</label>
        <input id="a-u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        ${crear ? `<p class="ayuda">De 3 a 20 caracteres: letras minúsculas, números o guion bajo. No se puede cambiar después.</p>` : ""}
        <label for="a-p">Contraseña</label>
        <input id="a-p" type="password" name="password" autocomplete="${crear ? "new-password" : "current-password"}" required minlength="6">
        ${crear ? `<p class="ayuda">Mínimo 6 caracteres. No hay forma de recuperarla sin correo, así que guárdala bien.</p>` : ""}
        <p class="error" id="a-err"></p>
        <div class="pie-v">
          <button type="button" class="boton gris fino" id="a-cancelar">Cancelar</button>
          <button type="submit" class="boton fino">${crear ? "Crear cuenta" : "Entrar"}</button>
        </div>
        <p class="cambio">${crear ? `¿Ya tienes cuenta? <button type="button" id="a-cambio">Entra</button>` : `¿Eres nuevo? <button type="button" id="a-cambio">Crea tu cuenta</button>`}</p>
      </form>`;
    t.querySelector("#a-cancelar").onclick = () => t.remove();
    t.querySelector("#a-cambio").onclick = () => { modo = crear ? "entrar" : "crear"; pintar(); };
    t.querySelector("form").onsubmit = async ev => {
      ev.preventDefault();
      const u = t.querySelector("#a-u").value.trim().toLowerCase();
      const p = t.querySelector("#a-p").value;
      const err = t.querySelector("#a-err");
      const enviar = t.querySelector('button[type=submit]');
      if(!/^[a-z0-9_]{3,20}$/.test(u)){ err.textContent = "El usuario debe tener de 3 a 20 caracteres: minúsculas, números o guion bajo."; return; }
      if(p.length < 6){ err.textContent = "La contraseña necesita al menos 6 caracteres."; return; }
      enviar.disabled = true; err.textContent = "";
      const email = `${u}@${DOMINIO_CUENTAS}`;
      const res = crear
        ? await sb.auth.signUp({ email, password:p, options:{ data:{ usuario:u } } })
        : await sb.auth.signInWithPassword({ email, password:p });
      enviar.disabled = false;
      if(res.error){
        const m = res.error.message || "";
        err.textContent =
          /already registered|already exists/i.test(m) ? "Ese nombre de usuario ya está ocupado." :
          /invalid login/i.test(m) ? "Usuario o contraseña incorrectos." :
          /rate limit|too many/i.test(m) ? "Demasiados intentos. Espera unos minutos." :
          /confirm/i.test(m) ? "Falta desactivar la confirmación de correo en Supabase." :
          /database error/i.test(m) ? "Ese nombre de usuario no es válido o ya existe." :
          /email/i.test(m) ? "Supabase rechazó la cuenta. Revisa la configuración de Email en Supabase." :
          "No se pudo completar. Intenta de nuevo.";
        return;
      }
      if(crear && !res.data.session){ err.textContent = "Cuenta creada, pero falta desactivar la confirmación de correo en Supabase."; return; }
      t.remove();
      avisar(crear ? `Bienvenido, ${u}` : `Hola de nuevo, ${u}`);
    };
    setTimeout(()=>t.querySelector("#a-u").focus(), 30);
  };
  pintar();
  t.addEventListener("click", e => { if(e.target === t) t.remove(); });
  document.body.appendChild(t);
}

function abrirRegistro(c){
  if(!yo){ abrirAcceso(); return; }
  const k = id(c), r = mios.get(k) || {};
  let cal = r.cal ? +r.cal : 0, like = !!r.me_gusta;
  const t = document.createElement("div");
  t.className = "telon";
  t.innerHTML = `
    <div class="ventana" role="dialog" aria-modal="true">
      <p style="margin:0;font-size:13px">Temporada ${c.s} · Capítulo ${c.e}</p>
      <h2>${esc(c.t)}</h2>
      <label for="r-f">Lo vi el</label>
      <input id="r-f" type="date" value="${r.visto_el || hoyISO()}" max="${hoyISO()}">
      <div class="opciones">
        <div><span style="font-size:13px;display:block;margin-bottom:2px">Calificación</span><span id="r-est"></span></div>
        <button type="button" class="toggle-like" id="r-like">${ICONO.corazon(like)} Me gusta</button>
      </div>
      <label for="r-t">Reseña</label>
      <textarea id="r-t" maxlength="4000" placeholder="¿Qué te dejó este capítulo?">${esc(r.resena || "")}</textarea>
      <div class="pie-v">
        ${mios.has(k) ? `<button type="button" class="boton gris fino" id="r-borrar" style="margin-right:auto">Borrar entrada</button>` : ""}
        <button type="button" class="boton gris fino" id="r-cancelar">Cancelar</button>
        <button type="button" class="boton fino" id="r-guardar">Guardar</button>
      </div>
    </div>`;
  document.body.appendChild(t);
  widgetEstrellas(t.querySelector("#r-est"), cal, v => cal = v);
  const likeBtn = t.querySelector("#r-like");
  likeBtn.onclick = () => { like = !like; likeBtn.innerHTML = `${ICONO.corazon(like)} Me gusta`; };
  t.querySelector("#r-cancelar").onclick = () => t.remove();
  t.addEventListener("click", e => { if(e.target === t) t.remove(); });
  t.querySelector("#r-guardar").onclick = async () => {
    const resena = t.querySelector("#r-t").value.trim();
    const ok = await guardarRegistro(k, { cal: cal || null, me_gusta: like, resena: resena || null, visto: true, visto_el: t.querySelector("#r-f").value || hoyISO(), por_ver:false });
    if(ok){ t.remove(); petalo(); avisar(cal ? `Guardado · ${estrellasTxt(cal)}` : "Guardado"); enrutar(); }
  };
  const borrar = t.querySelector("#r-borrar");
  if(borrar) borrar.onclick = async () => {
    if(!confirm("¿Borrar tu calificación y reseña de este capítulo?")) return;
    const { error } = await sb.from("registros").delete().eq("usuario_id", yo.id).eq("cap", k);
    if(error){ avisar("No se pudo borrar"); return; }
    mios.delete(k); t.remove(); avisar("Entrada borrada"); enrutar();
  };
}

async function vistaInicio(){
  const v = vista();
  const cab = yo
    ? `<div class="bienvenida"><p>Bienvenido de vuelta, <b>${esc(yo.usuario)}</b>. Esto es lo que ha estado viendo la comunidad…</p></div>`
    : `<div class="heroe"><h1>Registra los capítulos que has visto.<br>Califícalos sin piedad.<br>Cuéntale a todos cuál te hizo llorar.</h1>
       <p>El diario de La Rosa de Guadalupe: más de ${catalogo.length.toLocaleString("es-MX")} capítulos esperando tu reseña.</p>
       <button class="boton" id="h-crear">Crear cuenta gratis</button></div>`;

  const locales = leerLocales();
  const avisoLocal = yo && Object.keys(locales).length && !localStorage.getItem("rosa.migrado")
    ? `<div class="aviso-local"><span>Tienes ${Object.keys(locales).length} calificaciones guardadas en este dispositivo de la versión anterior.</span><button class="boton fino" id="migrar">Pasarlas a mi cuenta</button></div>` : "";

  v.innerHTML = `<div class="caja">${cab}${avisoLocal}
    <div class="seccion-t"><h2>Actividad reciente</h2><a href="#/miembros">Miembros</a></div>
    <div id="i-act" class="cargando">Cargando…</div>
    <div class="seccion-t"><h2>Populares esta semana</h2><a href="#/capitulos">Todos</a></div>
    <div id="i-pop" class="cargando">Cargando…</div>
    <div class="seccion-t"><h2>Reseñas recientes</h2></div>
    <div id="i-res" class="cargando">Cargando…</div>
  </div>`;
  const hc = $("#h-crear"); if(hc) hc.onclick = () => abrirAcceso("crear");
  const mg = $("#migrar"); if(mg) mg.onclick = migrarLocales;

  if(!sb){ ["#i-act","#i-pop","#i-res"].forEach(s=>$(s).outerHTML=`<p class="vacio">Configura Supabase para ver la actividad.</p>`); return; }

  const { data:acts } = await sb.from("registros")
    .select("cap,cal,me_gusta,visto,resena,actualizado,perfiles(usuario)")
    .or("visto.eq.true,cal.not.is.null")
    .order("actualizado", { ascending:false }).limit(120);
  const lista = (acts||[]).filter(a => porId.has(a.cap));

  const act = lista.slice(0,6);
  $("#i-act").outerHTML = act.length ? `<div class="fila-posters">${act.map(a=>{
    const c = porId.get(a.cap), u = a.perfiles?.usuario || "?";
    return `<div class="poster-act">${lamina(c)}
      <a class="pie" href="#/u/${encodeURIComponent(u)}">${avatar(u)}<span>${esc(u)}</span></a>
      <div class="sub"><span class="estrellas-txt">${estrellasTxt(a.cal)}${a.me_gusta?' <span class="corazon">♥</span>':""}</span><span>${hace(a.actualizado)}</span></div></div>`;
  }).join("")}</div>` : `<p class="vacio">Todavía nadie registra capítulos. Sé el primero.</p>`;

  const semana = Date.now() - 7*86400000, cuenta = new Map();
  lista.filter(a => new Date(a.actualizado) > semana).forEach(a => cuenta.set(a.cap, (cuenta.get(a.cap)||0) + 1));
  const pop = [...cuenta.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k])=>porId.get(k));
  $("#i-pop").outerHTML = pop.length ? `<div class="fila-posters">${pop.map(c=>`<div>${lamina(c)}</div>`).join("")}</div>` : `<p class="vacio">Esta semana está tranquila.</p>`;

  const res = lista.filter(a => a.resena).slice(0,8);
  $("#i-res").outerHTML = res.length ? `<div>${res.map(tarjetaResena).join("")}</div>` : `<p class="vacio">Aún no hay reseñas.</p>`;
}

function tarjetaResena(a, conPoster=true){
  const c = porId.get(a.cap), u = a.perfiles?.usuario || a.usuario || "?";
  return `<article class="resena">${conPoster ? lamina(c) : ""}
    <div class="cuerpo">
      ${conPoster ? `<h3><a href="#/cap/${a.cap}">${esc(c.t)}</a> <span style="font-family:'DM Sans';font-size:14px;color:var(--tenue);font-weight:400">T${c.s}·E${c.e}</span></h3>` : ""}
      <div class="quien">${avatar(u)} Reseña de <a href="#/u/${encodeURIComponent(u)}"><b>${esc(u)}</b></a>
        <span class="estrellas-txt">${estrellasTxt(a.cal)}</span>${a.me_gusta ? '<span class="corazon">♥</span>' : ""}
        <span>${hace(a.actualizado)}</span></div>
      <div class="texto">${esc(a.resena)}</div>
    </div></article>`;
}

/* ---------- migrar reseñas locales ---------- */
function leerLocales(){ try{ return JSON.parse(localStorage.getItem("rosa.resenas") || "{}"); }catch(e){ return {}; } }
async function migrarLocales(){
  const loc = leerLocales();
  const filas = Object.entries(loc).filter(([k]) => /^\d+x\d+$/.test(k)).map(([cap, r]) => ({
    usuario_id: yo.id, cap,
    cal: r.cal || null, visto: !!(r.visto || r.cal || r.txt), me_gusta: !!r.fav,
    por_ver: false, resena: r.txt || null,
    visto_el: r.cuando ? new Date(r.cuando).toISOString().slice(0,10) : null
  }));
  if(!filas.length) return;
  const { error } = await sb.from("registros").upsert(filas, { onConflict:"usuario_id,cap" });
  if(error){ avisar("No se pudieron pasar. Intenta de nuevo."); return; }
  localStorage.setItem("rosa.migrado", "1");
  await cargarYo(); avisar(`${filas.length} entradas pasadas a tu cuenta`); enrutar();
}

/* ---------- CAPÍTULOS ---------- */
const filtrosCap = { q:"", temporada:"", filtro:"", orden:"emision", limite:120 };
function vistaCapitulos(params){
  if(params.get("registrar")) setTimeout(()=>{ const q=$("#c-q"); if(q){ q.focus(); q.placeholder="Busca el capítulo que viste"; } }, 50);
  const temps = [...new Set(catalogo.map(c=>c.s))].sort((a,b)=>a-b);
  vista().innerHTML = `<div class="caja">
    <div class="herramientas">
      <input id="c-q" type="search" placeholder="Buscar capítulo por título o sinopsis" value="${esc(filtrosCap.q)}" autocomplete="off">
      <select id="c-t" aria-label="Temporada"><option value="">Todas las temporadas</option>${temps.map(n=>`<option value="${n}" ${String(n)===filtrosCap.temporada?"selected":""}>Temporada ${n}</option>`).join("")}</select>
      <select id="c-o" aria-label="Orden">
        <option value="emision">Orden de emisión</option>
        <option value="recientes">Más recientes primero</option>
        <option value="titulo">Título A-Z</option>
        ${yo ? `<option value="mia">Mi calificación</option>` : ""}
      </select>
    </div>
    ${yo ? `<div class="herramientas" style="margin-top:0">
      ${[["vistos","Vistos"],["pendientes","No vistos"],["me-gusta","Me gusta"],["por-ver","Por ver"],["resena","Con reseña"]]
        .map(([k,n])=>`<button class="chip" data-f="${k}" aria-pressed="${filtrosCap.filtro===k}">${n}</button>`).join("")}
    </div>` : ""}
    <p class="conteo" id="c-n"></p>
    <div class="rejilla" id="c-r"></div>
    <div class="mas" id="c-mas"></div>
  </div>`;
  $("#c-o").value = filtrosCap.orden;
  $("#c-q").addEventListener("input", e => { filtrosCap.q = e.target.value; filtrosCap.limite = 120; pintarRejilla(); });
  $("#c-t").addEventListener("change", e => { filtrosCap.temporada = e.target.value; filtrosCap.limite = 120; pintarRejilla(); });
  $("#c-o").addEventListener("change", e => { filtrosCap.orden = e.target.value; pintarRejilla(); });
  document.querySelectorAll(".chip[data-f]").forEach(b => b.addEventListener("click", () => {
    filtrosCap.filtro = filtrosCap.filtro === b.dataset.f ? "" : b.dataset.f;
    document.querySelectorAll(".chip[data-f]").forEach(x => x.setAttribute("aria-pressed", x.dataset.f === filtrosCap.filtro));
    filtrosCap.limite = 120; pintarRejilla();
  }));
  pintarRejilla();
}
function pintarRejilla(){
  const q = filtrosCap.q.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  let lista = catalogo.filter(c => {
    if(filtrosCap.temporada && String(c.s) !== filtrosCap.temporada) return false;
    if(q){
      const heno = (c.t+" "+(c.o||"")).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
      if(!heno.includes(q) && !(`t${c.s}e${c.e}` === q.replace(/\s/g,""))) return false;
    }
    const r = mios.get(id(c));
    switch(filtrosCap.filtro){
      case "vistos": return !!r?.visto;
      case "pendientes": return !r?.visto;
      case "me-gusta": return !!r?.me_gusta;
      case "por-ver": return !!r?.por_ver;
      case "resena": return !!r?.resena;
    }
    return true;
  });
  const cal = c => +(mios.get(id(c))?.cal || 0);
  if(filtrosCap.orden === "titulo") lista.sort((a,b)=>a.t.localeCompare(b.t,"es"));
  else if(filtrosCap.orden === "recientes") lista.sort((a,b)=>b.s-a.s || b.e-a.e);
  else if(filtrosCap.orden === "mia") lista.sort((a,b)=>cal(b)-cal(a) || a.s-b.s || a.e-b.e);
  else lista.sort((a,b)=>a.s-b.s || a.e-b.e);

  $("#c-n").textContent = `${lista.length.toLocaleString("es-MX")} ${lista.length===1?"capítulo":"capítulos"}`;
  const vis = lista.slice(0, filtrosCap.limite);
  $("#c-r").innerHTML = vis.length ? vis.map(c => {
    const r = mios.get(id(c));
    const mia = r ? `${r.cal ? `<span class="estrellas-txt">${estrellasTxt(r.cal)}</span>` : r.visto ? "Visto" : r.por_ver ? "Por ver" : ""}${r.me_gusta ? ' <span class="corazon">♥</span>' : ""}` : "";
    return `<div class="item">${lamina(c,{marca:true})}<h3>${esc(c.t)}</h3><div class="mia">${mia || fecha(c.d)}</div></div>`;
  }).join("") : `<p class="vacio" style="grid-column:1/-1">Nada por aquí. Cambia la búsqueda o quita los filtros.</p>`;
  $("#c-mas").innerHTML = lista.length > filtrosCap.limite ? `<button class="boton gris fino" id="c-mas-b">Mostrar más</button>` : "";
  const mb = $("#c-mas-b"); if(mb) mb.onclick = () => { filtrosCap.limite += 120; pintarRejilla(); };
}

/* ---------- FICHA DE CAPÍTULO ---------- */
async function vistaCapitulo(k){
  const c = porId.get(k);
  if(!c){ vista().innerHTML = `<div class="caja"><p class="vacio">Ese capítulo no existe. <a href="#/capitulos" style="text-decoration:underline">Ver todos</a></p></div>`; return; }
  const fondo = c.img ? `background-image:url('${IMG}w1280${c.img}')` : `background:${degradado(c)}`;
  const vecinoA = porId.get(`${c.s}x${c.e-1}`), vecinoB = porId.get(`${c.s}x${c.e+1}`);
  vista().innerHTML = `
    <div class="fondo-cap"><div class="img" style="${fondo}"></div></div>
    <div class="caja"><div class="cap">
      <div class="col-poster">${lamina(c,{enlace:false})}<div class="cifras" id="f-cifras"></div></div>
      <div class="col-info">
        <h1>${esc(c.t)}</h1>
        <p class="meta"><a href="#/capitulos?t=${c.s}">Temporada ${c.s}</a> · Capítulo ${c.e}${c.g ? ` · #${c.g}` : ""}${c.d ? ` · ${fecha(c.d)}` : ""}</p>
        <p class="sinopsis ${c.o||c.n ? "" : "vacia"}">${esc(c.o || c.n || "Este capítulo todavía no tiene sinopsis.")}</p>
        <p class="meta" style="font-size:13px;margin-top:14px">
          ${vecinoA ? `<a href="#/cap/${id(vecinoA)}">← Anterior</a>` : ""}
          ${vecinoA && vecinoB ? " · " : ""}
          ${vecinoB ? `<a href="#/cap/${id(vecinoB)}">Siguiente →</a>` : ""}</p>
        <div class="seccion-t"><h2>Reseñas</h2></div>
        <div id="f-res" class="cargando">Cargando…</div>
      </div>
      <div class="col-panel">
        <div class="panel" id="f-panel"></div>
        <div class="histo"><div class="seccion-t" style="margin-top:0"><h2>Calificaciones</h2><span id="f-fans" style="font-size:12px;color:var(--tenue)"></span></div><div id="f-histo"></div></div>
      </div>
    </div></div>`;
  pintarPanel(c);
  if(!sb){ $("#f-res").outerHTML = `<p class="vacio">Configura Supabase para ver reseñas.</p>`; return; }

  const [{ data:todos }, { data:resenas }] = await Promise.all([
    sb.from("registros").select("cal,visto,me_gusta").eq("cap", k),
    sb.from("registros").select("cap,cal,me_gusta,resena,actualizado,perfiles(usuario)").eq("cap", k).not("resena","is",null).order("actualizado",{ascending:false}).limit(60)
  ]);
  const t = todos || [];
  const vistos = t.filter(x=>x.visto).length, likes = t.filter(x=>x.me_gusta).length;
  $("#f-cifras").innerHTML = `<span title="Lo han visto">${ICONO.ojo(true).replace('<svg ','<svg style="width:15px;height:15px;vertical-align:-3px" ')} ${vistos}</span><span title="Les gustó"><span class="corazon">♥</span> ${likes}</span>`;

  const cals = t.map(x=>+x.cal).filter(Boolean);
  const cubos = [.5,1,1.5,2,2.5,3,3.5,4,4.5,5].map(v => cals.filter(x=>x===v).length);
  const tope = Math.max(1, ...cubos);
  const prom = cals.length ? (cals.reduce((a,b)=>a+b,0)/cals.length).toFixed(1) : null;
  $("#f-fans").textContent = cals.length ? `${cals.length} ${cals.length===1?"calificación":"calificaciones"}` : "";
  $("#f-histo").innerHTML = cals.length ? `<div class="fila-h">
      <span class="estrellas-txt" style="font-size:11px">★</span>
      <div class="barras">${cubos.map((n,i)=>`<span style="height:${n/tope*100}%" title="${n} × ${estrellasTxt((i+1)/2)}"></span>`).join("")}</div>
      <span class="estrellas-txt" style="font-size:11px">★★★★★</span>
      <span class="prom">${prom.replace(".",",")}</span></div>` : `<p style="font-size:13px;color:var(--tenue)">Nadie lo ha calificado todavía.</p>`;

  const rs = (resenas||[]).filter(r=>r.resena);
  $("#f-res").outerHTML = rs.length ? `<div>${rs.map(r=>tarjetaResena(r,false)).join("")}</div>` : `<p class="vacio">Sin reseñas todavía. ${yo ? "Escribe la primera." : ""}</p>`;
}

function pintarPanel(c){
  const k = id(c), r = mios.get(k) || {}, p = $("#f-panel");
  if(!p) return;
  if(!yo){
    p.innerHTML = `<button class="fila" id="p-entrar" style="border-top:0;padding:18px 12px">Entra para registrar, calificar o reseñar</button><button class="fila" id="p-compartir">Compartir</button>`;
    p.querySelector("#p-entrar").onclick = () => abrirAcceso("entrar");
  }else{
    const esFav = (yo.favoritos||[]).includes(k);
    p.innerHTML = `
      <div class="acciones">
        <button class="accion" id="p-visto">${ICONO.ojo(r.visto)}<span>${r.visto ? "Visto" : "Ver"}</span></button>
        <button class="accion" id="p-like">${ICONO.corazon(r.me_gusta)}<span>${r.me_gusta ? "Te gusta" : "Me gusta"}</span></button>
        <button class="accion" id="p-porver">${ICONO.reloj(r.por_ver)}<span>Por ver</span></button>
      </div>
      <div class="calif"><small>${r.cal ? "Calificado" : "Calificar"}</small><span id="p-est"></span></div>
      <button class="fila" id="p-resena">${r.resena ? "Editar mi reseña…" : "Reseñar o registrar…"}</button>
      <button class="fila" id="p-fav">${esFav ? "Quitar de mis favoritos" : "Poner en mis 4 favoritos"}</button>
      <button class="fila" id="p-compartir">Compartir</button>`;
    widgetEstrellas(p.querySelector("#p-est"), r.cal ? +r.cal : 0, async v => {
      await guardarRegistro(k, { cal: v || null, visto: v ? true : (mios.get(k)?.visto || false), visto_el: mios.get(k)?.visto_el || (v ? hoyISO() : null) });
      if(v) petalo();
      pintarPanel(c);
    });
    p.querySelector("#p-visto").onclick = async () => {
      const ahora = !r.visto;
      await guardarRegistro(k, { visto: ahora, visto_el: ahora ? (r.visto_el || hoyISO()) : null, ...(ahora ? { por_ver:false } : { cal:null }) });
      pintarPanel(c);
    };
    p.querySelector("#p-like").onclick = async () => {
      await guardarRegistro(k, { me_gusta: !r.me_gusta }); pintarPanel(c);
    };
    p.querySelector("#p-porver").onclick = async () => {
      await guardarRegistro(k, { por_ver: !r.por_ver }); pintarPanel(c);
    };
    p.querySelector("#p-resena").onclick = () => abrirRegistro(c);
    p.querySelector("#p-fav").onclick = async () => {
      let favs = [...(yo.favoritos||[])];
      if(esFav) favs = favs.filter(x=>x!==k);
      else{ if(favs.length >= 4){ avisar("Ya tienes 4 favoritos. Quita uno desde tu perfil."); return; } favs.push(k); }
      const { error } = await sb.from("perfiles").update({ favoritos: favs }).eq("id", yo.id);
      if(error){ avisar("No se pudo guardar"); return; }
      yo.favoritos = favs; avisar(esFav ? "Quitado de favoritos" : "Agregado a tus favoritos"); pintarPanel(c);
    };
  }
  p.querySelector("#p-compartir").onclick = async () => {
    const url = location.href;
    try{
      if(navigator.share) await navigator.share({ title:c.t, url });
      else { await navigator.clipboard.writeText(url); avisar("Link copiado"); }
    }catch(e){}
  };
}

/* ---------- PERFIL ---------- */
async function vistaPerfil(usuario, pestana="perfil"){
  const v = vista();
  if(!sb){ v.innerHTML = `<div class="caja"><p class="vacio">Configura Supabase para ver perfiles.</p></div>`; return; }
  v.innerHTML = `<div class="caja"><p class="cargando">Cargando…</p></div>`;
  const { data:p } = await sb.from("perfiles").select("*").eq("usuario", usuario).maybeSingle();
  if(!p){ v.innerHTML = `<div class="caja"><p class="vacio">No existe el usuario ${esc(usuario)}.</p></div>`; return; }
  const { data:rs } = await sb.from("registros").select("*").eq("usuario_id", p.id).order("actualizado",{ascending:false});
  const regs = (rs||[]).filter(r => porId.has(r.cap));
  const propio = yo && yo.id === p.id;
  const anio = String(new Date().getFullYear());
  const vistos = regs.filter(r=>r.visto);
  const u = encodeURIComponent(p.usuario);

  const tabs = [["perfil","Perfil",""],["diario","Diario","/diario"],["resenas","Reseñas","/resenas"],["por-ver","Por ver","/por-ver"],["me-gusta","Me gusta","/me-gusta"]];
  let cuerpo = "";

  if(pestana === "perfil"){
    const favs = (p.favoritos||[]).map(k=>porId.get(k)).filter(Boolean);
    cuerpo = `
      <div class="seccion-t"><h2>Capítulos favoritos</h2></div>
      <div class="fila-favs">${[0,1,2,3].map(i => favs[i] ? `<div>${lamina(favs[i])}</div>` : `<div class="hueco"></div>`).join("")}</div>
      ${propio && favs.length < 4 ? `<p style="font-size:13px;color:var(--tenue);margin-top:8px">Agrega favoritos desde la página de cada capítulo.</p>` : ""}
      <div class="seccion-t"><h2>Actividad reciente</h2><a href="#/u/${u}/diario">Todo</a></div>
      ${regs.length ? `<div class="fila-posters">${regs.slice(0,6).map(r=>`<div class="poster-act">${lamina(porId.get(r.cap))}<div class="sub"><span class="estrellas-txt">${estrellasTxt(r.cal)}${r.me_gusta?' <span class="corazon">♥</span>':""}</span><span>${r.resena?"✎":""}</span></div></div>`).join("")}</div>` : `<p class="vacio">Todavía no registra capítulos.</p>`}
      <div class="seccion-t"><h2>Reseñas recientes</h2><a href="#/u/${u}/resenas">Todas</a></div>
      ${regs.filter(r=>r.resena).slice(0,3).map(r=>tarjetaResena({...r, usuario:p.usuario})).join("") || `<p class="vacio">Sin reseñas todavía.</p>`}`;
  }
  else if(pestana === "diario"){
    const entradas = vistos.slice().sort((a,b)=>(b.visto_el||b.actualizado).localeCompare(a.visto_el||a.actualizado));
    let mesPrevio = "";
    cuerpo = entradas.length ? `<table class="diario"><thead><tr><th>Mes</th><th>Día</th><th>Capítulo</th><th class="ocultable">Temporada</th><th>Calificación</th><th class="ocultable">♥</th><th class="ocultable">Reseña</th></tr></thead><tbody>
      ${entradas.map(r => {
        const c = porId.get(r.cap), f = (r.visto_el || r.actualizado).slice(0,10), [a,m,d] = f.split("-");
        const clave = a+m, mes = clave !== mesPrevio ? `${MESES[+m-1]} ${a}` : ""; mesPrevio = clave;
        return `<tr><td class="mes">${mes}</td><td class="dia">${+d}</td><td><a href="#/cap/${r.cap}" style="color:#fff">${esc(c.t)}</a></td><td class="ocultable">T${c.s}·E${c.e}</td><td class="estrellas-txt">${estrellasTxt(r.cal)}</td><td class="ocultable corazon">${r.me_gusta?"♥":""}</td><td class="ocultable">${r.resena?"✎":""}</td></tr>`;
      }).join("")}</tbody></table>` : `<p class="vacio">El diario está vacío.</p>`;
  }
  else if(pestana === "resenas"){
    const conR = regs.filter(r=>r.resena);
    cuerpo = conR.length ? conR.map(r=>tarjetaResena({...r, usuario:p.usuario})).join("") : `<p class="vacio">Sin reseñas todavía.</p>`;
  }
  else {
    const campo = pestana === "por-ver" ? "por_ver" : "me_gusta";
    const l = regs.filter(r=>r[campo]).map(r=>porId.get(r.cap));
    cuerpo = l.length ? `<div class="rejilla" style="margin-top:24px">${l.map(c=>`<div class="item">${lamina(c,{marca:true})}<h3>${esc(c.t)}</h3></div>`).join("")}</div>` : `<p class="vacio">No hay nada aquí todavía.</p>`;
  }

  v.innerHTML = `<div class="caja">
    <div class="perfil-cab">
      ${avatar(p.usuario)}
      <div>
        <h1>${esc(p.usuario)}</h1>
        <p class="bio" id="bio">${esc(p.bio) || (propio ? '<span style="color:var(--tenue)">Sin biografía</span>' : "")}</p>
        ${propio ? `<button class="boton gris fino" id="ed-bio" style="margin-top:8px;padding:5px 10px;font-size:12px">Editar perfil</button>` : ""}
      </div>
      <div class="datos">
        <div class="dato"><b>${vistos.length}</b><span>Capítulos</span></div>
        <div class="dato"><b>${vistos.filter(r=>(r.visto_el||r.actualizado).startsWith(anio)).length}</b><span>Este año</span></div>
        <div class="dato"><b>${regs.filter(r=>r.resena).length}</b><span>Reseñas</span></div>
      </div>
    </div>
    <nav class="pestanas">${tabs.map(([k,n,ruta])=>`<a href="#/u/${u}${ruta}" class="${k===pestana?"activa":""}">${n}</a>`).join("")}</nav>
    ${cuerpo}
  </div>`;

  const eb = $("#ed-bio");
  if(eb) eb.onclick = () => {
    const t = document.createElement("div");
    t.className = "telon";
    t.innerHTML = `<div class="ventana"><h2>Editar perfil</h2>
      <label for="b-t">Biografía</label><textarea id="b-t" maxlength="160" style="min-height:80px">${esc(p.bio)}</textarea>
      <p class="ayuda">Máximo 160 caracteres.</p>
      ${(p.favoritos||[]).length ? `<label>Favoritos</label>${p.favoritos.map(k=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0">${esc(porId.get(k)?.t || k)}<button class="boton gris fino" data-quitar="${k}" style="padding:4px 10px;font-size:12px">Quitar</button></div>`).join("")}` : ""}
      <div class="pie-v"><button class="boton gris fino" id="b-c">Cancelar</button><button class="boton fino" id="b-g">Guardar</button></div></div>`;
    document.body.appendChild(t);
    let favs = [...(p.favoritos||[])];
    t.querySelectorAll("[data-quitar]").forEach(b => b.onclick = () => { favs = favs.filter(x=>x!==b.dataset.quitar); b.parentElement.remove(); });
    t.querySelector("#b-c").onclick = () => t.remove();
    t.addEventListener("click", e => { if(e.target === t) t.remove(); });
    t.querySelector("#b-g").onclick = async () => {
      const bio = t.querySelector("#b-t").value.trim().slice(0,160);
      const { error } = await sb.from("perfiles").update({ bio, favoritos:favs }).eq("id", yo.id);
      if(error){ avisar("No se pudo guardar"); return; }
      yo.bio = bio; yo.favoritos = favs; t.remove(); avisar("Perfil actualizado"); enrutar();
    };
  };
}

/* ---------- MIEMBROS ---------- */
async function vistaMiembros(){
  const v = vista();
  if(!sb){ v.innerHTML = `<div class="caja"><p class="vacio">Configura Supabase para ver miembros.</p></div>`; return; }
  v.innerHTML = `<div class="caja"><div class="seccion-t"><h2>Miembros</h2></div><p class="cargando">Cargando…</p></div>`;
  const { data } = await sb.from("perfiles").select("usuario,bio,creado,registros(count)").order("creado",{ascending:true}).limit(500);
  const l = (data||[]).map(p=>({ ...p, n: p.registros?.[0]?.count || 0 })).sort((a,b)=>b.n-a.n);
  v.innerHTML = `<div class="caja"><div class="seccion-t"><h2>Miembros</h2><span style="font-size:12px;color:var(--tenue)">${l.length}</span></div>
    ${l.length ? l.map(p=>`<a class="miembro" href="#/u/${encodeURIComponent(p.usuario)}">${avatar(p.usuario)}<div><b>${esc(p.usuario)}</b><div style="font-size:13px">${esc(p.bio)}</div></div><span class="n">${p.n} ${p.n===1?"capítulo":"capítulos"}</span></a>`).join("") : `<p class="vacio">Todavía no hay miembros.</p>`}
  </div>`;
}

/* =========================================================
   RUTAS
   ========================================================= */
async function enrutar(){
  const [ruta, qs] = (location.hash.slice(1) || "/").split("?");
  const params = new URLSearchParams(qs || "");
  const partes = ruta.split("/").filter(Boolean).map(decodeURIComponent);
  const d = $(".desplegable"); if(d) d.remove();

  if(!configurado){
    vista().innerHTML = `<div class="config"><h2 style="margin-bottom:10px">Falta un paso</h2>
      <p>Abre <code>index.html</code> y pega tu <code>SUPABASE_URL</code> y <code>SUPABASE_KEY</code> en la sección de configuración.</p></div>`;
    return;
  }
  if(partes[0] === "cap" && partes[1]) await vistaCapitulo(partes[1]);
  else if(partes[0] === "capitulos"){
    if(params.get("t")) filtrosCap.temporada = params.get("t");
    vistaCapitulos(params);
  }
  else if(partes[0] === "u" && partes[1]) await vistaPerfil(partes[1].toLowerCase(), partes[2] || "perfil");
  else if(partes[0] === "miembros") await vistaMiembros();
  else await vistaInicio();
}
let rutaPrevia = "";
window.addEventListener("hashchange", () => {
  const nueva = location.hash.split("?")[0];
  if(nueva !== rutaPrevia) window.scrollTo({ top:0 });
  rutaPrevia = nueva;
  enrutar();
});

/* =========================================================
   ARRANQUE
   ========================================================= */
(async () => {
  await cargarCatalogo();
  await cargarYo();
  pintarMenu();
  rutaPrevia = location.hash.split("?")[0];
  await enrutar();
  if(sb){
    sb.auth.onAuthStateChange((evento, sesion) => {
      const nuevoId = sesion?.user?.id || null;
      if(nuevoId === (yo?.id || null)) return;       // mismo usuario: no recargar
      setTimeout(async () => { await cargarYo(); pintarMenu(); enrutar(); }, 0);
    });
  }
})();

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
